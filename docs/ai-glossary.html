let currentLang = "en";
let simRunning = false;
let simTimer = null;

function toggleTermDetail(toggleBtn) {
  const expanded = toggleBtn.getAttribute("aria-expanded") === "true";
  toggleBtn.setAttribute("aria-expanded", String(!expanded));
  const detail = document.getElementById(toggleBtn.getAttribute("aria-controls"));
  detail.hidden = expanded;
}

function toggleAllCards(open) {
  document.querySelectorAll(".term-toggle").forEach((btn) => {
    btn.setAttribute("aria-expanded", String(open));
    document.getElementById(btn.getAttribute("aria-controls")).hidden = !open;
  });
}

function resetSimulator(s) {
  clearInterval(simTimer);
  simRunning = false;
  const runBtn = document.getElementById("run-btn");
  runBtn.disabled = false;
  document.querySelectorAll("#sim-pipeline .sim-step").forEach((step) => {
    step.classList.remove("active", "done");
  });
  document.getElementById("sim-log").textContent = s.idleMessage;
}

function runSimulation() {
  if (simRunning) return;
  const s = STRINGS[currentLang];
  const select = document.getElementById("scenario-select");
  const scenario = s.scenarios.find((sc) => sc.id === select.value) || s.scenarios[0];
  const steps = document.querySelectorAll("#sim-pipeline .sim-step");
  const log = document.getElementById("sim-log");
  const runBtn = document.getElementById("run-btn");

  simRunning = true;
  runBtn.disabled = true;
  steps.forEach((step) => step.classList.remove("active", "done"));

  let i = 0;
  simTimer = setInterval(() => {
    if (i > 0) {
      steps[i - 1].classList.remove("active");
      steps[i - 1].classList.add("done");
    }
    if (i < steps.length) {
      steps[i].classList.add("active");
      log.textContent = scenario.steps[i];
      i++;
    } else {
      clearInterval(simTimer);
      log.textContent = scenario.steps[scenario.steps.length - 1] + " " + s.doneMessage;
      runBtn.disabled = false;
      simRunning = false;
    }
  }, 2600);
}

function render(lang) {
  currentLang = lang;
  const s = STRINGS[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = s.dir;

  document.getElementById("eyebrow").textContent = s.eyebrow;
  document.getElementById("page-title").textContent = s.title;
  document.getElementById("intro").textContent = s.intro;

  const expandBtn = document.getElementById("expand-all-btn");
  const collapseBtn = document.getElementById("collapse-all-btn");
  expandBtn.textContent = s.expandAll;
  collapseBtn.textContent = s.collapseAll;
  expandBtn.onclick = () => toggleAllCards(true);
  collapseBtn.onclick = () => toggleAllCards(false);

  const termsEl = document.getElementById("terms");
  termsEl.innerHTML = "";
  s.terms.forEach((t, i) => {
    const card = document.createElement("div");
    card.className = "term-card";
    const detailId = "term-detail-" + i;
    card.innerHTML =
      `<button type="button" class="term-toggle" aria-expanded="false" aria-controls="${detailId}">` +
      `<span class="term-badge">${t.letter}</span>` +
      `<span class="term-head"><span class="term-name">${t.name}</span><span class="term-def">${t.def}</span></span>` +
      CHEVRON_SVG +
      `</button>` +
      `<div class="term-detail" id="${detailId}" hidden>` +
      `<p class="term-example">${t.example}</p>` +
      `<p class="term-analogy">💡 ${t.analogy}</p>` +
      `</div>`;
    termsEl.appendChild(card);
  });
  termsEl.querySelectorAll(".term-toggle").forEach((btn) => {
    btn.addEventListener("click", () => toggleTermDetail(btn));
  });

  document.getElementById("ui-heading").textContent = s.uiHeading;
  document.getElementById("ui-body").textContent = s.uiBody;

  document.getElementById("compare-heading").textContent = s.compareHeading;
  document.getElementById("compare-intro").textContent = s.compareIntro;
  document.getElementById("compare-analogy").textContent = s.compareAnalogy;

  const gridEl = document.getElementById("provider-grid");
  gridEl.innerHTML = "";
  s.providers.forEach((p) => {
    const card = document.createElement("div");
    card.className = "provider-card";
    card.innerHTML =
      `<div class="provider-head"><span class="provider-badge p-${p.key}">${p.name[0]}</span><span class="provider-name">${p.name}</span></div>` +
      `<div class="provider-rows">` +
      `<div class="provider-row"><span class="row-label">${s.rowLabels.model}</span><span class="row-value">${p.model}</span></div>` +
      `<div class="provider-row"><span class="row-label">${s.rowLabels.app}</span><span class="row-value">${p.app}</span></div>` +
      `<div class="provider-row"><span class="row-label">${s.rowLabels.agent}</span><span class="row-value">${p.agent}</span></div>` +
      `</div>`;
    gridEl.appendChild(card);
  });

  document.getElementById("sim-heading").textContent = s.simHeading;
  document.getElementById("sim-intro").textContent = s.simIntro;
  document.getElementById("scenario-label").textContent = s.scenarioLabel;
  document.getElementById("run-btn").textContent = s.runButton;
  document.getElementById("run-btn").onclick = runSimulation;

  const select = document.getElementById("scenario-select");
  select.innerHTML = "";
  s.scenarios.forEach((sc) => {
    const opt = document.createElement("option");
    opt.value = sc.id;
    opt.textContent = sc.label;
    select.appendChild(opt);
  });

  const pipelineEl = document.getElementById("sim-pipeline");
  pipelineEl.innerHTML = "";
  s.stepLabels.forEach((label, i) => {
    const step = document.createElement("div");
    step.className = "sim-step";
    step.innerHTML = `<div class="step-num">${i + 1}</div><div class="step-label">${label}</div>`;
    pipelineEl.appendChild(step);
  });

  resetSimulator(s);

  document.getElementById("footer").innerHTML =
    s.footer.replace(
      "ModelDispatcher",
      '<a href="https://github.com/joka-7/ModelDispatcher" target="_blank" rel="noreferrer">ModelDispatcher</a>',
    );

  const switchEl = document.getElementById("lang-switch");
  switchEl.innerHTML = "";
  for (const code of LANGS) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "lang-btn";
    btn.textContent = STRINGS[code].langName;
    btn.setAttribute("aria-pressed", String(code === lang));
    btn.addEventListener("click", () => {
      render(code);
      try {
        localStorage.setItem("aiGlossaryLang", code);
      } catch {
        // Private browsing / storage blocked — language just won't persist.
      }
    });
    switchEl.appendChild(btn);
  }
}

let initial = "en";
try {
  const saved = localStorage.getItem("aiGlossaryLang");
  if (saved && LANGS.includes(saved)) initial = saved;
} catch {
  // No storage available — default to English.
}
render(initial);
</script>
