name: Release

# Triggered by pushing a version tag (e.g. `v0.2.0`). This publishes
# model-dispatcher to PyPI and the matching modeldispatcher-client,
# modeldispatcher-browser-agent, and modeldispatcher-react-ui builds to the
# public npm registry, and is what makes the git-pinned installs in
# templates/vercel-app/api/requirements.txt (and the README's
# `git+...@v0.2.0` examples) resolve to a real, published point in history.
# All four packages' own version fields must match the pushed tag exactly —
# bump every one you want this run to actually publish before tagging.
#
# The three JS packages publish via npm Trusted Publishing (OIDC) — same
# posture as PyPI below, no stored token. Trusted publishing can't perform a
# package's *first* publish, though: each of the three needed one manual
# `npm publish` (see each package's README) before its npm Trusted Publisher
# was registered (npmjs.com → package → Settings → Trusted Publisher,
# owner=joka-7, repo=ModelDispatcher, workflow=release.yml). Only after that
# one-time bootstrap does this workflow's own publish steps work.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Re-verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"
          pip install firebase-admin

      - name: Ruff lint
        run: ruff check src tests templates

      - name: Ruff format check
        run: ruff format --check src tests templates

      - name: mypy (strict, core library)
        run: mypy --strict src

      - name: pytest (core library + Vercel template)
        run: pytest tests templates/vercel-app/api/tests

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install TS client dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: TS type-check
        working-directory: clients/typescript
        run: npm run typecheck

      - name: TS test
        working-directory: clients/typescript
        run: npm test

      - name: Set up Node (browser agent)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/browser-agent/package-lock.json

      - name: Install browser-agent dependencies
        working-directory: clients/browser-agent
        run: npm ci

      - name: Browser agent type-check
        working-directory: clients/browser-agent
        run: npm run typecheck

      - name: Browser agent test
        working-directory: clients/browser-agent
        run: npm test

  publish_pypi:
    name: Publish model-dispatcher to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no API token/secret needed.
      # A "pending publisher" must be registered on PyPI first: Account Settings
      # → Publishing, with owner=joka-7, repo=ModelDispatcher, workflow=release.yml.
      # If that publisher was registered *without* an environment name, delete the
      # `environment: pypi` line above to match.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Verify pyproject.toml version matches the pushed tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        # `release/v1` is a branch, not a tag — upstream moves it, so the ref
        # is mutable in a workflow that holds PyPI publish rights. Pinned to a
        # SHA on that branch; Dependabot bumps it like any other action.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish_ts_client:
    name: Publish modeldispatcher-client
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      # Required for npm Trusted Publishing (OIDC) — no token/secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        # No registry-url: it makes setup-node write an _authToken=${NODE_AUTH_TOKEN}
        # line into a generated .npmrc even though NODE_AUTH_TOKEN is never set here —
        # npm then tries that (empty) classic-token auth first and never falls through
        # to OIDC trusted publishing, failing with a 404 that looks like a trusted-
        # publisher mismatch but isn't one. registry.npmjs.org is npm's default
        # anyway, so omitting this is enough.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Build
        working-directory: clients/typescript
        run: npm run build

      - name: Verify package.json version matches the pushed tag
        working-directory: clients/typescript
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        working-directory: clients/typescript
        run: npm publish --provenance

  publish_browser_agent:
    name: Publish modeldispatcher-browser-agent
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      # Required for npm Trusted Publishing (OIDC) — no token/secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        # See publish_ts_client's Set up Node step for why registry-url is omitted.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/browser-agent/package-lock.json

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        working-directory: clients/browser-agent
        run: npm ci

      - name: Build
        working-directory: clients/browser-agent
        run: npm run build

      - name: Verify package.json version matches the pushed tag
        working-directory: clients/browser-agent
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        working-directory: clients/browser-agent
        run: npm publish --provenance

  publish_react_ui:
    name: Publish modeldispatcher-react-ui
    runs-on: ubuntu-latest
    # Depends on publish_browser_agent (not just verify): react-ui's own
    # dependency on modeldispatcher-browser-agent must already be
    # published at the new version before `npm install` here can resolve it.
    needs: [verify, publish_browser_agent]
    permissions:
      # Required for npm Trusted Publishing (OIDC) — no token/secret needed.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        # See publish_ts_client's Set up Node step for why registry-url is omitted.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Ensure npm supports Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        # No committed lockfile (see clients/react-ui: it depends on a
        # package published from this same repo, so `npm ci` isn't usable)
        # — the public registry needs no auth for this, unlike when
        # browser-agent lived on GitHub Packages.
        working-directory: clients/react-ui
        run: npm install

      - name: Build
        working-directory: clients/react-ui
        run: npm run build

      - name: Verify package.json version matches the pushed tag
        working-directory: clients/react-ui
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        working-directory: clients/react-ui
        run: npm publish --provenance

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish_pypi, publish_ts_client, publish_browser_agent, publish_react_ui]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
