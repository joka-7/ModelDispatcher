name: Release

# Triggered by pushing a version tag (e.g. `v0.2.0`). This publishes
# model-dispatcher to PyPI and the matching @joka-7/modeldispatcher-client,
# @joka-7/modeldispatcher-browser-agent, and @joka-7/modeldispatcher-react-ui
# builds to the public npm registry, and is what makes the git-pinned installs
# in templates/vercel-app/api/requirements.txt (and the README's
# `git+...@v0.2.0` examples) resolve to a real, published point in history.
# All four packages' own version fields must match the pushed tag exactly —
# bump every one you want this run to actually publish before tagging.
#
# The three npm packages need an NPM_TOKEN secret (an npm automation token
# with publish rights on the @joka-7 org/user) — see each publish_* job below.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Re-verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          pip install -e ".[dev]"
          pip install firebase-admin

      - name: Ruff lint
        run: ruff check src tests templates

      - name: Ruff format check
        run: ruff format --check src tests templates

      - name: mypy (strict, core library)
        run: mypy --strict src

      - name: pytest (core library + Vercel template)
        run: pytest tests templates/vercel-app/api/tests

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install TS client dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: TS type-check
        working-directory: clients/typescript
        run: npm run typecheck

      - name: TS test
        working-directory: clients/typescript
        run: npm test

      - name: Set up Node (browser agent)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/browser-agent/package-lock.json

      - name: Install browser-agent dependencies
        working-directory: clients/browser-agent
        run: npm ci

      - name: Browser agent type-check
        working-directory: clients/browser-agent
        run: npm run typecheck

      - name: Browser agent test
        working-directory: clients/browser-agent
        run: npm test

  publish_pypi:
    name: Publish model-dispatcher to PyPI
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) — no API token/secret needed.
      # A "pending publisher" must be registered on PyPI first: Account Settings
      # → Publishing, with owner=joka-7, repo=ModelDispatcher, workflow=release.yml.
      # If that publisher was registered *without* an environment name, delete the
      # `environment: pypi` line above to match.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Verify pyproject.toml version matches the pushed tag
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match pyproject.toml version $pkg_version"
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        # `release/v1` is a branch, not a tag — upstream moves it, so the ref
        # is mutable in a workflow that holds PyPI publish rights. Pinned to a
        # SHA on that branch; Dependabot bumps it like any other action.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish_ts_client:
    name: Publish @joka-7/modeldispatcher-client
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Install dependencies
        working-directory: clients/typescript
        run: npm ci

      - name: Build
        working-directory: clients/typescript
        run: npm run build

      - name: Verify package.json version matches the pushed tag
        working-directory: clients/typescript
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        working-directory: clients/typescript
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_browser_agent:
    name: Publish @joka-7/modeldispatcher-browser-agent
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: clients/browser-agent/package-lock.json

      - name: Install dependencies
        working-directory: clients/browser-agent
        run: npm ci

      - name: Build
        working-directory: clients/browser-agent
        run: npm run build

      - name: Verify package.json version matches the pushed tag
        working-directory: clients/browser-agent
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        working-directory: clients/browser-agent
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish_react_ui:
    name: Publish @joka-7/modeldispatcher-react-ui
    runs-on: ubuntu-latest
    # Depends on publish_browser_agent (not just verify): react-ui's own
    # dependency on @joka-7/modeldispatcher-browser-agent must already be
    # published at the new version before `npm install` here can resolve it.
    needs: [verify, publish_browser_agent]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        # No committed lockfile (see clients/react-ui: it depends on a
        # @joka-7 package published from this same repo, so `npm ci` isn't
        # usable). No registry auth needed for the install itself anymore —
        # browser-agent is a public package now.
        working-directory: clients/react-ui
        run: npm install

      - name: Build
        working-directory: clients/react-ui
        run: npm run build

      - name: Verify package.json version matches the pushed tag
        working-directory: clients/react-ui
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag v$tag_version does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Publish to npm
        working-directory: clients/react-ui
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  create_release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish_pypi, publish_ts_client, publish_browser_agent, publish_react_ui]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
