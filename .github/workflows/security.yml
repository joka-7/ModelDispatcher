# Security scanning. Kept identical in shape across every repo in the
# portfolio so a finding means the same thing wherever it appears.
name: Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: a secret removed in a later commit is still in the
          # pack, and still valid until it's rotated.
          fetch-depth: 0
      - name: gitleaks
        # The gitleaks CLI directly rather than gitleaks-action: the action
        # lists the PR's commits via the GitHub API, which 403s under the
        # default CI token permissions. A CLI scan needs no API access.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source=/repo --redact --verbose

  python-dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install --upgrade pip
          pip install ".[dev,openai,anthropic,gemini]"
          pip install pip-audit
          pip-audit

  python-sast:
    name: Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install bandit
        # -ll: report medium severity and above only. Low is almost
        # entirely assert/subprocess noise in this codebase.
      - run: bandit -r src/model_dispatcher -ll

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # `.ai` and the per-tool skill trees are vendored ogen-ai config with
          # no dependency manifests of their own — scanning them finds nothing
          # and only slows the job.
          skip-dirs: ".ai,.agents,.claude,.cursor"
          format: table
          severity: HIGH,CRITICAL
          # Advisory alongside the dependency audits above: report findings in
          # the job log without failing until the backlog is cleared. SARIF
          # upload is deliberately omitted — it needs code scanning enabled,
          # which on a private repo requires GitHub Advanced Security.
          exit-code: 0
          scanners: vuln

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
      - name: Perform CodeQL analysis
        # Non-blocking until "Code scanning" is enabled in repository settings
        # (on a private repo that needs GitHub Advanced Security): the analysis
        # runs, but its SARIF upload errors with "Code scanning is not enabled
        # for this repository". continue-on-error on this step lets the job go
        # green while still running the analysis. Remove once enabled.
        continue-on-error: true
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: "/language:${{ matrix.language }}"
